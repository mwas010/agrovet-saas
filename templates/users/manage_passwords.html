{% extends 'base.html' %} {% block title %}Manage User Passwords - Luanda Feeds
Centre{% endblock %} {% block content %}
<div class="card" style="max-width: 100%" ;>
  <h2 class="card-title">Manage User Passwords</h2>
  <p style="margin-bottom: 20px; color: #666">
    Change passwords for active users. Passwords must be at least 8 characters.
  </p>

  <form method="post" id="passwordForm">
    {% csrf_token %}
    <div class="form-group">
      <label for="user_id">Select User *</label>
      <select id="user_id" name="user_id" class="form-control" required>
        <option value="">Choose a user...</option>
        {% for user in users %}
        <option value="{{ user.id }}">
          {{ user.get_full_name|default:user.username }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="new_password">New Password *</label>
      <input
        type="password"
        id="new_password"
        name="new_password"
        class="form-control"
        required
        minlength="8"
      />
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password *</label>
      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        class="form-control"
        required
        minlength="8"
      />
    </div>

    <div class="action-buttons">
      <button type="submit" class="btn">Update Password</button>
    </div>
  </form>

  <div style="margin-top: 30px">
    <a href="{% url 'inventory:manager_dashboard' %}" class="btn btn-outline"
      >Back to Dashboard</a
    >
  </div>
</div>

<script>
  document
    .getElementById("passwordForm")
    .addEventListener("submit", function (e) {
      const newPass = document.getElementById("new_password").value;
      const confirmPass = document.getElementById("confirm_password").value;

      if (newPass !== confirmPass) {
        e.preventDefault();
        alert("Passwords do not match. Please try again.");
        return false;
      }

      if (newPass.length < 8) {
        e.preventDefault();
        alert("Password must be at least 8 characters.");
        return false;
      }

      return confirm("Are you sure you want to change this password?");
    });
</script>
{% endblock %}
