{% extends 'base.html' %}

{% block title %}Add Item - Luanda Feeds Centre{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <h2 class="card-title">Add New Item</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Item Name *</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="buying_price">Buying Price (KES) *</label>
                <input type="number" id="buying_price" name="buying_price" class="form-control" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="selling_price">Selling Price (KES) *</label>
                <input type="number" id="selling_price" name="selling_price" class="form-control" step="0.01" min="0" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="current_stock">Initial Stock</label>
                <input type="number" id="current_stock" name="current_stock" class="form-control" step="0.001" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="low_stock_threshold">Low Stock Threshold</label>
                <input type="number" id="low_stock_threshold" name="low_stock_threshold" class="form-control" step="0.001" min="0" value="0">
            </div>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" class="form-control" placeholder="e.g., Poultry Feed, Dairy, Fertilizer">
        </div>

        <div class="action-buttons" style="margin-top: 20px;">
            <button type="submit" class="btn">Save Item</button>
            <a href="{% url 'inventory:inventory_list' %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
